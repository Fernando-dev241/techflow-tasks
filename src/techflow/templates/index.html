<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechFlow Tasks</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #172b4d; }
    header { background: #0b3d91; color: #fff; padding: 16px 24px; }
    main { padding: 24px; max-width: 1100px; margin: auto; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    input, select, button { padding: 8px 10px; border: 1px solid #c1c7d0; border-radius: 4px; }
    input { flex: 1; min-width: 160px; }
    button { background: #0b3d91; color: #fff; cursor: pointer; border: 0; }
    button.sec { background: #e9ecef; color: #172b4d; }
    #erro { color: #b00020; min-height: 1.2em; }
    .quadro { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .coluna { background: #ebecf0; border-radius: 6px; padding: 12px; }
    .coluna h2 { font-size: 1rem; margin: 0 0 12px; }
    .card { background: #fff; border-radius: 4px; padding: 10px; margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
    .card p { margin: 4px 0 8px; font-size: .9rem; color: #5e6c84; }
    .acoes { display: flex; gap: 6px; flex-wrap: wrap; }
    @media (max-width: 700px) { .quadro { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><h1>TechFlow Tasks</h1></header>
  <main>
    <form id="form-tarefa">
      <input id="titulo" placeholder="Título da tarefa" maxlength="100" required>
      <input id="descricao" placeholder="Descrição (opcional)">
      <button type="submit">Adicionar</button>
    </form>
    <div id="erro" role="alert"></div>
    <section class="quadro" id="quadro"></section>
  </main>
  <script>
    const COLUNAS = ["A Fazer", "Em Progresso", "Concluído"];

    async function chamar(url, opcoes) {
      const resposta = await fetch(url, opcoes);
      if (!resposta.ok) {
        const corpo = await resposta.json().catch(() => ({}));
        throw new Error(corpo.erro || "Erro inesperado.");
      }
      return resposta.status === 204 ? null : resposta.json();
    }

    function botao(texto, classe, acao) {
      const b = document.createElement("button");
      b.textContent = texto;
      b.className = classe;
      b.onclick = () => acao().then(carregar).catch(mostrarErro);
      return b;
    }

    function mostrarErro(e) { document.getElementById("erro").textContent = e.message; }

    function criarCard(tarefa) {
      const card = document.createElement("div");
      card.className = "card";
      const titulo = document.createElement("strong");
      titulo.textContent = tarefa.titulo;
      const desc = document.createElement("p");
      desc.textContent = tarefa.descricao;
      const acoes = document.createElement("div");
      acoes.className = "acoes";
      COLUNAS.filter(c => c !== tarefa.status).forEach(destino => {
        acoes.append(botao("→ " + destino, "sec", () => chamar("/api/tasks/" + tarefa.id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: destino })
        })));
      });
      acoes.append(botao("Excluir", "sec", () =>
        chamar("/api/tasks/" + tarefa.id, { method: "DELETE" })));
      card.append(titulo, desc, acoes);
      return card;
    }

    async function carregar() {
      const tarefas = await chamar("/api/tasks");
      const quadro = document.getElementById("quadro");
      quadro.replaceChildren();
      COLUNAS.forEach(nome => {
        const coluna = document.createElement("div");
        coluna.className = "coluna";
        const h = document.createElement("h2");
        const doStatus = tarefas.filter(t => t.status === nome);
        h.textContent = nome + " (" + doStatus.length + ")";
        coluna.append(h, ...doStatus.map(criarCard));
        quadro.append(coluna);
      });
    }

    document.getElementById("form-tarefa").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await chamar("/api/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            titulo: document.getElementById("titulo").value,
            descricao: document.getElementById("descricao").value
          })
        });
        e.target.reset();
        document.getElementById("erro").textContent = "";
        carregar();
      } catch (erro) { mostrarErro(erro); }
    };

    carregar().catch(mostrarErro);
  </script>
</body>
</html>
